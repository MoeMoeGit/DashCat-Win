[package]
name = "dashcat-win"
version = "0.1.0"
edition = "2021"
description = "DashCat for Windows - System tray app with monitoring and sleep prevention"
authors = ["MoeMoeGit"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true