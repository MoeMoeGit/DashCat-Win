name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Prepare release artifact
        run: |
          mkdir -p release
          cp target/x86_64-pc-windows-gnu/release/dashcat-win.exe release/DashCat.exe
          strip release/DashCat.exe || true

      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev-build" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashCat-${{ steps.version.outputs.VERSION }}
          path: release/DashCat.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: DashCat-${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: DashCat.exe
          body: |
            ## DashCat-Win ${{ github.ref_name }}
            
            Windows 版系统托盘猫咪工具
            
            ### 功能
            - 系统监控 (CPU/内存)
            - 剪贴板历史管理
            - 防止休眠
            - 鼠标滚轮反转
            
            ### 安装
            下载 `DashCat.exe`，双击运行即可。