name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_msix:
        description: 'Build MSIX package'
        required: false
        default: 'true'
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Prepare release artifact
        run: |
          mkdir -p release
          cp target/x86_64-pc-windows-gnu/release/dashcat-win.exe release/DashCat.exe
          strip release/DashCat.exe || true

      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev-build-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashCat-exe-${{ steps.version.outputs.VERSION }}
          path: release/DashCat.exe

  build-msix:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_msix == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release

      - name: Prepare MSIX layout
        run: |
          mkdir -p msixPackage/assets/icons
          cp target/release/dashcat-win.exe msixPackage/DashCat.exe
          cp assets/icons/app_icon_44.png msixPackage/assets/icons/
          cp assets/icons/app_icon_50.png msixPackage/assets/icons/
          cp assets/icons/app_icon_150.png msixPackage/assets/icons/
          cp assets/icons/app_icon_310.png msixPackage/assets/icons/
          cp AppxManifest.xml msixPackage/
        shell: bash

      - name: Create MSIX
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $manifest = Get-Content msixPackage/AppxManifest.xml -Raw
          $manifest = $manifest -replace 'Version="[^"]*"', "Version=`"$version.0`""
          Set-Content msixPackage/AppxManifest.xml $manifest
          
          MakeAppx pack /d msixPackage /p DashCat.msix /o
        shell: pwsh

      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev-build-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashCat-msix-${{ steps.version.outputs.VERSION }}
          path: DashCat.msix

  release:
    needs: [build-exe, build-msix]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: DashCat-exe-${{ github.ref_name }}
          path: release/

      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: DashCat-msix-${{ github.ref_name }}
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/DashCat.exe
            release/DashCat.msix
          body: |
            ## DashCat-Win ${{ github.ref_name }}
            
            Windows 版系统托盘猫咪工具
            
            ### 功能
            - 系统监控 (CPU/内存)
            - 防止休眠 (三档)
            - 开机自启
            
            ### 安装
            
            **方式一：便携版**
            下载 `DashCat.exe`，双击运行即可。
            
            **方式二：MSIX 安装包**
            下载 `DashCat.msix`，双击安装。